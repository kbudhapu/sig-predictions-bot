# =====================================================================================
# SIG MARKET COVERAGE — measured live from GET /markets on 2026-10-02 (237 markets)
# =====================================================================================
sig_coverage:
  measured_on: "2026-10-02"
  total_markets: 237
  control_markets: 4          # R/D x {U.S. Senate, U.S. House}. No governor-control market.
  senate:
    baseline_up_seats: 35
    sig_markets: 34
    missing_from_sig: [ohio]  # the Vance-seat special is NOT listed by SIG
  governors:
    baseline_up_seats: 36
    sig_markets: 35
    missing_from_sig: [ohio]
  house:
    total_seats: 435
    sig_markets: 46           # battleground subset only
  # *** THREE-WAY RACES: an Independent leg is listed, so the outcome space is NOT a 2-way
  # complement. For chamber control this is worse than it looks: a winning independent's effect
  # on control depends on WHICH PARTY THEY CAUCUS WITH, which is not knowable before the fact.
  # chamber_model therefore treats these seats as control-INDETERMINATE (see baselines.py).
  three_way_races:
    - {chamber: Senate,   state: nebraska}
    - {chamber: Senate,   state: montana}
    - {chamber: Governor, state: rhode island}
