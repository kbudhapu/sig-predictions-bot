# race_mapping.yaml — SIG race ↔ external venue (Polymarket / Kalshi) comparables for the divergence edge.
#
# Loaded by signals/mapping.py; CONSUMED by signals/cross_market.py (which applies `polarity` and the
# confidence/resolution/liquidity gate before any price reaches signals/divergence.py). Schema v2.
#
# ─────────────────────────────────────────────────────────────────────────────────────────────────────
# SAFETY CONTRACT (a WRONG mapping is worse than NO mapping):
#   An entry feeds the engine ONLY if  confidence: high  AND  resolution_match: true  AND at least one
#   external venue has  liquidity_ok: true  (RaceMapping.is_active). Anything else is recorded but DORMANT.
# ─────────────────────────────────────────────────────────────────────────────────────────────────────
#
# POLARITY — THE #1 CORRECTNESS TRAP:
#   "direct"   ⇒ venue_yes_price == SIG_yes      (venue YES is the SAME party/event as the SIG YES)
#   "inverted" ⇒ venue_yes_price == 1 − SIG_yes  (venue YES is the OPPOSITE party)
#   The resolver (signals/cross_market.py) applies the flip EXACTLY ONCE. Get it backwards for any race
#   and that race trades BACKWARDS forever. Verified two independent ways for every ACTIVE race below:
#     (a) same-/opposite-party question match (documented per race in `notes` + the polarity comment), and
#     (b) COMPLEMENTARITY — the aligned R and D legs of a race sum to ≈1.0 (they are the two sides of one
#         event); a mislabelled leg would make the sum ≈0 or ≈2. Checks (2026-10-02 live prices):
#           Senate : R 0.365 (562794, direct) + D 0.625 (562793, direct)            = 0.99  ✓
#           House  : R 0.075 (562803, direct) + D 1−0.075=0.925 (562803, inverted)  = 1.00  ✓  (and the
#                    independent D-House market 562802 reads 0.925 — matches the inverted alignment)
#           GA gov : R 0.52  (629338, direct) + independent D 0.485 (629337)        = 1.005 ✓
#
# ═══ LIVE POLYMARKET RE-MAP (2026-10-02, pulled from the server) ══════════════════════
#   Polymarket Gamma + CLOB are REACHABLE from the droplet (HTTP 200, NOT the build-env 451 — the
#   geoblock does not apply to the droplet's egress) and the 2026 markets are DEEP + live two-sided:
#   Senate control ~$5.5M, House control ~$12.8M, GA governor ~$0.14M cumulative volume. The OLD gamma
#   slugs (which-party-will-control-the-senate-after-the-2026-election, …) are DEAD (return []); the live
#   markets are per-party sub-markets under events "Which party will win the Senate/House in 2026?" and
#   "Georgia Governor Election Winner". Each sub-market is binary — outcomes ["Yes","No"], Yes = that
#   party controls/wins — so we key on the gamma `market_id` + the Yes-leg `yes_token_id` (CLOB /midpoint
#   is the freshest cross-check; gamma outcomePrices is the fallback — both confirmed working, see
#   signals/poly_client.py). poly_client's GAMMA_BASE/CLOB_BASE already point at these live hosts; no
#   client change was needed — only the ids below.
#
#   Kalshi (api.elections.kalshi.com): REACHABLE but every 2026 WINNER market is STILL EMPTY (no
#   bid/ask/last/volume/OI as of 2026-10-02) → every Kalshi leg stays liquidity_ok:false (DORMANT).
#
# ═══ RESOLUTION-MISMATCH TRAPS (look comparable, resolve DIFFERENTLY — never map) ═════════════════════
#   Polymarket: the "Party A / Option A win …" placeholder sub-markets (price null) are NOT the party
#   markets — map ONLY the explicit "Republican"/"Democratic" sub-markets. Kalshi: KXMIDTERMMOV (margin),
#   *ADVANCE* (primary), KXCAHOUSEDEM (seat count), KXDHOUSESUPERMAJ (supermajority), KXLTGOV (Lt.
#   Governor), KXTXHOUSE / KXMOSD (STATE legislature) — each resolves on a different event.

