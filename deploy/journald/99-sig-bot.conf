# journald retention cap for sig-bot — the gap mbappe's deploy left open. On a 1-core/1GB droplet a
# unbounded journal is a real disk-exhaustion risk (a crash-loop can write GBs/day); an out-of-disk
# box takes the trader down with it. Install to /etc/systemd/journald.conf.d/99-sig-bot.conf, then
# `systemctl restart systemd-journald`.
#
# This is a GLOBAL journald drop-in (journald is system-wide; it has no per-service size knob — the
# per-unit control is RateLimit*, set here too). Tune SystemMaxUse down if the box also hosts other
# services; 200M of logs on a 1GB box leaves ample headroom while retaining ~days of history.
[Journal]
Storage=persistent
Compress=yes
# Hard ceiling on persisted journal + always keep this much disk free (whichever binds first).
SystemMaxUse=200M
SystemKeepFree=150M
# Per-file rotation so old data ages out predictably.
SystemMaxFileSize=20M
MaxFileSec=1day
MaxRetentionSec=14day
# Runtime (tmpfs, pre-flush) ceiling — small, so a boot-loop can't fill RAM.
RuntimeMaxUse=40M
# Rate-limit a chatty/crash-looping unit so one component can't flood the journal (burst per 30s).
RateLimitIntervalSec=30s
RateLimitBurst=2000
ForwardToSyslog=no
